name: get-time

on: push

jobs:
 job1:
    name: first job
    runs-on: ubuntu-latest
    steps:
    - name: step one 
      uses: actions/checkout@v4
    - name: step two 
      run: echo date +"%Y-%m-%d"
 
 job2:
    name: second job     
    runs-on: macos-latest
    steps:
    - name: step one 
      uses: actions/checkout@v4
    - name: step two
      run: echo date +"%Y-%m-%d"

 job3:
    name: third job
    runs-on: windows-latest
    steps:
    - name: step one
      uses: actions/checkout@v4
    - name: step two
      run: Write-Output Get-Date -Format "MM/dd/yyyy"

