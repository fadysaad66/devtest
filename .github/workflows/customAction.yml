name: custom_action

on: push
jobs:
 test:
  runs-on: ubuntu-latest
  permissions:
   checks: write
  steps:
  - name: test external repo
    uses: actions/checkout@v4
    with:
          repository: fadysaad66/HiveBox
          path: external-code
          ref: main 
  - name: build docker
    run: |
       docker build -f ./external-code/phase1.Dockerfile -t app ./external-code
  - name: run docker
    run: |
       docker run app
  - name: Run tests
    run: pytest --junitxml=junit/test-results.xml
  
  - name: Upload test results
    uses: actions/upload-artifact@v3
    with:
      name: python-test-results
      path: junit/test-results.xml
        
